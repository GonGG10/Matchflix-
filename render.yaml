services:
  - type: web
    name: matchflix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "30d"
      - key: CORS_ORIGIN
        value: "*"
      - key: WATCHMODE_API_KEY
        value: "wm_xH9Kv9WylyBGhU_g7nP19C1QqgiyUR-2CHIloQ60GSA"
        sync: true
      - key: WATCHMODE_BASE_URL
        value: "https://api.watchmode.com/v1"
      - key: CATALOG_SYNC_COUNTRY
        value: "ES"
      - key: CATALOG_SYNC_CRON
        value: "0 3 * * *"
