<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="$FLUTTER_BASE_HREF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MatchFlix — Deslizad juntos, encontrad la película perfecta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MatchFlix">
  <title>MatchFlix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0E0E16;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #loader .logo-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      animation: pulse 1.8s ease-in-out infinite;
      box-shadow: 0 0 24px rgba(255, 93, 115, 0.25);
    }
    #loader .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #loader .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #FF5D73;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loader p {
      color: #A0A0AD;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.92; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo-wrapper">
      <img src="icons/Icon-192.png" alt="MatchFlix">
    </div>
    <div class="spinner"></div>
    <p>MatchFlix</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
