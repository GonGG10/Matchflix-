<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="$FLUTTER_BASE_HREF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MatchFlix — Deslizad juntos, encontrad la película perfecta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MatchFlix">
  <title>MatchFlix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    body { margin: 0; padding: 0; background-color: #0E0E16; }
    #loader {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    #loader .logo {
      width: 88px; height: 88px; border-radius: 22px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #loader .logo img { width: 100%; height: 100%; object-fit: cover; }
    #loader p { color: #A0A0AD; font-family: -apple-system, sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">
      <img src="icons/Icon-192.png" alt="MatchFlix">
    </div>
    <p>MatchFlix</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
